<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="pipe"></div>
    <div id="deck"></div>
    <div id="hull">
        <div id="left"></div>
        <p id="center"></p>
        <div id="right"></div>
    </div>
    <p id="oceanTop"></p>
    <p id="oceanBottom">
        <style>
            body {
                background: #191919;
                display: grid;
                place-items: center;
                place-content: center;
            }

            #pipe,
            #deck,
            #left,
            #right {
                border: 10px solid #5DBCF9;
                border-bottom: 0px;
            }

            #pipe {
                width: 30px;
                height: 20px
            }

            #deck,
            #left,
            #right {
                width: 80px;
            }

            #deck {
                height: 48px
            }

            #hull {
                display: flex;
                height: 50px
            }

            #left,
            #right {
                height: 25px;
            }

            #left {
                rotate: -30deg;
                border-right: 0px;
                translate: 20px -8px
            }

            #right {
                rotate: 30deg;
                border-left: 0px;
                translate: -20px -8px
            }

            p {
                margin: 0px;
                background: #5DBCF9;
                width: 110px;
                height: 10px;
            }

            #center {
                width: 10px;
                height: 60px;
                translate: 0 -20px
            }

            #oceanTop {
                width: 200px;
                margin-bottom: 10px;
                box-shadow: 0px -10px #191919;
                z-index: 1;
            }
            </style>
</body>
</html>

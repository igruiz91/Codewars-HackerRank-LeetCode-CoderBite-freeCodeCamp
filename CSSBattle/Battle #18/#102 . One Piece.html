<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="skull">
        <div id="eyeLeft"></div>
        <div id="eyeRight"></div>
    </div>
    <p></p>
    <p></p>
    <p></p>
    <p></p>
    <div id="teeth"></div>
    <style>
        body {
            background: #000;
            display: grid;
            place-items: center;
        }

        div {
            background: #FFF;
        }

        #skull {
            width: 150px;
            height: 100px;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        #eyeLeft,
        #eyeRight {
            height: 50px;
            width: 40px;
            background: #000;
            border-radius: 20px / 25px;
            rotate: 65deg;
        }

        #eyeRight {
            rotate: -65deg
        }

        p {
            position: absolute;
            height: 20px;
            width: 20px;
            background: #FFF;
        }

        p:after {
            content: "";
            display: block;
            height: 25px;
            width: 25px;
            background: #FFF;
            border-radius: 50%;
            translate: -18px 5px;
            box-shadow: 0px -15px #FFF
        }

        #teeth {
            position: absolute;
            width: 15px;
            height: 20px;
            translate: -19.5px 80px;
            color: #FFF;
            box-shadow: 20px 0px, 40px 0;
        }

        p:nth-child(2) {
            translate: -76.5px -37px;
            rotate: 45deg;
        }

        p:nth-child(3) {
            translate: 77px -37px;
            rotate: 135deg;
        }

        p:nth-child(4) {
            translate: 77px 57px;
            rotate: -135deg;
        }

        p:nth-child(5) {
            translate: -76.5px 57px;
            rotate: -45deg;
        }
    </style>
</body>

</html>

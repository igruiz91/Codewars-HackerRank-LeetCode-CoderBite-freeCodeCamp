<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="body_bottom"></div>
    <div id="body_top"></div>
    <div id="mastil"></div>
    <div id="clavijero"></div>
    <style>
        body {
            background: #F3AC3C;
            display: grid;
            justify-content: center;
            align-items: center;
            grid-template-columns: 70px 100px 100px 40px;
        }

        #body_bottom {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #998235;
        }

        #body_bottom:after {
            content: "";
            display: block;
            background: #1A4341;
            height: 40px;
            width: 10px;
            translate: 40px 40px;
            border-radius: 10px
        }

        #body_top {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #998235;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #body_top:after {
            content: "";
            width: 40px;
            height: 40px;
            background: #1A4341;
            border-radius: 50%;
            border: solid #F3AC3C 5px
        }

        #mastil {
            background: #1A4341;
            width: 110px;
            translate: -5px;
            height: 20px;
            z-index: -1
        }

        #clavijero {
            height: 30px;
            width: 40px;
            background: #998235;
            border-radius: 10px;
            display: flex;
            justify-content: center;
        }

        #clavijero:after {
            content: "";
            width: 20px;
            height: 4px;
            margin-top: 8px;
            border-radius: 2px;
            background: #1A4341;
            box-shadow: 0 10px #1A4341;
        }
</body>
</html>

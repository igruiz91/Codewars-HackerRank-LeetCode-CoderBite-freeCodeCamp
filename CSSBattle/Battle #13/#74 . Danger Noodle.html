<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div></div>
<div></div>
<div></div>
<div></div>
<div></div>
<div></div>
<style>
    body {
        background: #191919;
    }

    div,
    :before,
    :after {
        content: "";
        display: block;
        box-sizing: border-box;
    }

    div {
        width: 70px;
        border: 5px solid #E08027;
        position: absolute;
    }

    div:after {
        width: 100%;
        height: 100%;
        border: 5px solid #E08027;
    }

    div:nth-child(odd) {
        padding: 0 10px 10px;
        bottom: 40px;
        border-radius: 0 0 50px 50px;
        border-top: 0;
    }

    div:nth-child(odd):after {
        border-radius: 0 0 50px 50px;
        border-top: 0;
    }

    div:nth-child(even) {
        padding: 10px 10px 0;
        top: 40px;
        border-radius: 50px 50px 0 0;
        border-bottom: 0;
    }

    div:nth-child(even):after {
        border-bottom: 0;
        border-radius: 50px 50px 0 0;
    }

    div:nth-child(1) {
        height: 70px;
        bottom: auto;
        top: 90px;
        left: -35
    }

    div:nth-child(2) {
        height: 70px;
        left: 15.2px
    }

    div:nth-child(3) {
        height: 150px;
        left: 65.5px
    }

    div:nth-child(4) {
        height: 150px;
        left: 115.7px
    }

    div:nth-child(5) {
        height: 80px;
        left: 165.9px
    }

    div:nth-child(6) {
        height: 80px;
        width: 65px;
        left: 216;
        top: 140;
        border-radius: 35px 0 0;
        border-right: 0;
        border-bottom: 0;
    }

    div:nth-child(6):after {
        border-radius: 20px 0 0;
        border-right: 0
    }

    body:before {
        content: "";
        position: absolute;
        background: #E08027;
        height: 30px;
        width: 50px;
        border-radius: 14px 20px 20px 14px;
        right: 85px;
        top: 135;
    }

    body:after {
        position: absolute;
        background: #191919;
        height: 10px;
        width: 10px;
        top: calc(50% + 3px);
        right: 95px;
        border-radius: 50%;
        box-shadow: 0 -16px;
    }
</style>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div flame></div>
    <div top></div>
    <div body></div>
    
    <style>
        body {
            background: #14313E;
            display: grid;
            place-content: center;
            place-items: center
        }
    
        [flame] {
            height: 50px;
            width: 30px;
            border-radius: 30px 0;
            background: #F3AC3C;
            translate: 15px;
            z-index: 1
        }
    
        [top] {
            height: 30px;
            width: 80px;
            border-radius: 50%;
            background: #F3695A;
            box-shadow: 0 100px #BA3E46;
        }
    
        [top]:after {
            content: '';
            display: block;
            height: 30px;
            width: 60px;
            background: #14313E;
            border-radius: 50%;
            translate: 10px -10px
        }
    
        [body] {
            height: 100px;
            background: #BA3E46;
            translate: 0 -13px;
            z-index: -1;
            width: 80px
        }
    </style>

</body>
</html>

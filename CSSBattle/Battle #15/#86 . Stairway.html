<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
    </div>
    <style>
        body {
            display: grid;
            place-content: center;
            background: #191919;
        }
    
        div {
            width: 100px;
            height: 150px;
            background: #4F77FF;
            border-radius: 50px 50px 0 0;
            overflow: hidden;
            display: grid;
            grid-template-rows: 24px 24px 24px 24px
        }
    
        p {
            margin-top: 58;
            margin-left: 20px;
            top: 40px;
            height: 20px;
            width: 80px;
            background: #191919;
        }
    
        p:nth-child(1) {
            margin-left: 80px;
        }
    
        p:nth-child(2) {
            margin-left: 60px;
        }
    
        p:nth-child(3) {
            margin-left: 40px;
        }
    </style>
</body>
</html>

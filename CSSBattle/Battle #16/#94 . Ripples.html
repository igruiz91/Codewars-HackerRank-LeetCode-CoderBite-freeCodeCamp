<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div></div>
    <style>
        body {
            background: radial-gradient(circle, #F3AC3C 40%, #0E2E2C 1%);
            display: grid;
            place-content: center
        }
    
        div {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: solid #0E2E2C 14px;
            background: #F3AC3C;
            box-shadow: inset 0 0 0 8px #F3AC3C,
                inset 0 0 0 20px #0E2E2C,
                inset 0 0 0 30px #998235,
                inset 0 0 0 40px #0E2E2C,
                inset 0 0 0 52px #F3AC3C,
                inset 0 0 0 60px #0E2E2C,
                inset 0 0 0 70px #F3AC3C;
        }
    </style>
</body>
</html>

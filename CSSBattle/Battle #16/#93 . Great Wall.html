<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p></p>
        <p></p>
        <p></p>
    </div>
    <style>
        body {
            display: grid;
            place-content: center;
            background: #4F77FF;
    
        }
    
        div {
            width: 200px;
            height: 200px;
            background: #F9E492;
            border-radius: 50%;
            overflow: hidden;
            display: grid;
            align-content: end;
            box-shadow: inset -40px -40px 0 80px #191919
        }
    
        p {
            height: 16px;
            width: 100px;
            margin: 5px 0;
            background: #F9E492;
            box-shadow: 120px -13px #F9E492
        }
    
        p:after {
            content: "";
            display: block;
            width: 20px;
            height: 16px;
            translate: 100px -6.5px;
            background: #D6B73F;
            transform: skew(0deg, -33.5deg)
        }
    
        p:nth-child(3) {
            margin-bottom: 10px
        }
    </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="eye1"></div>
    <div id="eye2"></div>
    <div id="head">
        <div id="nostrill1"></div>
        <div id="nostrill2"></div>
        <div></div>
    </div>
    <style>
        body {
            display: grid;
            background: #293462;
            place-content: center;
            place-items: center;
            grid-template: 20px 100px / 70px 70px;
        }

        div {
            border-radius: 50px;
        }

        #eye1,
        #eye2 {
            width: 50px;
            height: 50px;
            background: radial-gradient(#293462 5px, #FFF1C1 5px 15px, #FE5F55 15px);
            margin-top: 20px;
        }

        #head {
            width: 150px;
            height: 100px;
            background: radial-gradient(circle at 75px -130px, #FE5F55 200px, #A64942 0px);
            grid-column: span 2;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px
        }

        #nostrill1,
        #nostrill2 {
            height: 10px;
            width: 10px;
            background: #293462;
            margin-top: 10px;
            translate: 5px;
        }
    </style>
</body>
</html>

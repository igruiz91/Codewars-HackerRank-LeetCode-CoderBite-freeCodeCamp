<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <style>
        body {
            background: #191919;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div {
            width: 50px;
            height: 40px;
            margin-right: 20px;
            translate: -5px 40px;
            border-radius: 50%;
            background: #FE5F55;
        }

        div:before {
            content: "";
            height: 100px;
            width: 10px;
            background: #FE5F55;
            display: block;
            translate: 40px -80px
        }

        div:after {
            content: "";
            display: inherit;
            width: 38px;
            height: 10px;
            background: #FE5F55;
            translate: 42px -180px;
        }

        div:nth-child(2)::after {
            translate: 4px -180px;
        }

        div:nth-child(3)::after,
        div:nth-child(3),
        div:nth-child(3)::before {
            background: #A64942;
        }

        div:nth-child(4)::after {
            box-shadow: 0 20px #FE5F55
        }
    </style>
</body>
</html>

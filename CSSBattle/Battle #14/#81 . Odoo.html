<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <style>
        body {
            background: #191919;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 32px;
            gap: 2px;
        }

        div {
            width: 40px;
            height: 40px;
            background: #191919;
            border-radius: 50%;
            border: solid #8F8F8F 20px;
        }

        div:nth-child(2):after {
            content: '';
            display: block;
            height: 65px;
            width: 20px;
            background: #8F8F8F;
            border-radius: 20px;
            translate: 40px -40px
        }

        div:nth-child(1) {
            border-color: #714B67;
        }
    </style>
</body>

</html>
